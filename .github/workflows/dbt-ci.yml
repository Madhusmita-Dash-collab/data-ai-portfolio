name: Banking Analytics dbt CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'projects/banking-analytics-dbt/**'
      - '.github/workflows/dbt-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'projects/banking-analytics-dbt/**'
      - '.github/workflows/dbt-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt-validation:
    name: Validate Banking Analytics dbt Project
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/banking-analytics-dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'

      - name: Install dbt and DuckDB adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.8.8 dbt-duckdb==1.8.2

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          banking_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ${{ github.workspace }}/projects/banking-analytics-dbt/banking_analytics_ci.duckdb
                threads: 1
          EOF

      - name: Check dbt connection
        run: dbt debug

      - name: Build models and run tests
        run: dbt build --full-refresh
